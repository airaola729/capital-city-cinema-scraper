name: Scrape showtimes

on:
  schedule:
    - cron: '5 13 * * *'   # 13:05 UTC = 8:05 EST / 9:05 EDT
  workflow_dispatch:
    inputs:
      mode:
        description: 'Browser mode'
        type: choice
        options: [headless, headed]
        default: headless
      sources:
        description: 'Sources, comma-separated: 4eye, afi, atom, atom-presale-formats, atom-day-by-day (Atom is off by default: Cloudflare blocks it from GitHub)'
        required: false
        default: '4eye,afi'

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'headless' }}
      # Scheduled runs skip Atom Tickets: Cloudflare challenges it from GitHub's servers (tested 2026-11-22).
      SOURCES: ${{ inputs.sources || '4eye,afi' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scrape
        run: |
          if [ "$MODE" = "headed" ]; then
            xvfb-run -a node scrape.mjs
          else
            node scrape.mjs
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(TZ=America/New_York date +%F) ($MODE)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
