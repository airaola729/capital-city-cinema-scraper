name: Scrape showtimes

on:
  schedule:
    - cron: '47 10 * * *'   # 10:47 UTC = 5:47 EST / 6:47 EDT (early, so the watchdog has time to fix problems before the 10:17 ET publish)
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these sources, comma-separated (blank = all): alamo, amc, angelika, miracle, afi, 4eye, suns, cinemaclock, smithsonian'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONLY: ${{ inputs.only || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scrape
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}   # AMC catalog API key; only the amc source reads it
        run: node scrape.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(TZ=America/New_York date +%F)"
            # Push to the branch being run (main for the daily run; a test branch for a watchdog fix).
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # Runs after the data commit. Fails the run (so GitHub notifies the owner and the
      # watchdog sees it) when any theater or the AFI specials isn't current for today.
      - name: Check freshness
        run: node scripts/check-fresh.mjs
