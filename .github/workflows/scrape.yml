name: Scrape showtimes

on:
  schedule:
    - cron: '5 13 * * *'   # 13:05 UTC = 8:05 EST / 9:05 EDT
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these sources, comma-separated (blank = all): alamo, fever, angelika, miracle, afi, 4eye'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ONLY: ${{ inputs.only || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Scrape
        run: node scrape.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: $(TZ=America/New_York date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
