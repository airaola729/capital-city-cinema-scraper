name: Rotten Tomatoes scores

on:
  schedule:
    - cron: '7 12 * * *'   # 12:07 UTC = 7:07 EST / 8:07 EDT: after the showtimes scrape, well before the 10:17 ET publish
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape            # same group as the showtimes scrape, so the two never push at the same time
  cancel-in-progress: false

jobs:
  rt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Rotten Tomatoes lists
        run: node scripts/rt.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rt.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: rt $(TZ=America/New_York date +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
